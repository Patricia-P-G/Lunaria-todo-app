name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  integration-delivery:
    runs-on: ubuntu-22.04
    container:
      image: node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Install TestCafe
        run: npm install -g testcafe

      - name: Update APT
        run: apt-get update

      - name: Install Chromium
        run: apt-get install -y chromium

      - name: Run TestCafe tests against the built app
        run: |
          npx vite preview --port 4173 &
          sleep 5
          testcafe "chromium:headless --no-sandbox" test/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deployment:
    needs: integration-delivery
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4