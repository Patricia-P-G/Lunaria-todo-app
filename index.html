<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunaria | My Tasks</title>
  </head>


  <body>
    <div class="container">
      <h1>Todo App</h1>

      <form class="todo-form">
        <input type="text" placeholder="Add a new task" id="todo-input">

        <select id="priority-select" aria-label="Task priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>

        <button type="submit">Add</button>
      </form>

      <p id="error-message">Please enter a todo item</p>

      <!-- Task filters -->
      <div class="todo-filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-button active" data-filter="all">All</button>
        <button type="button" class="filter-button" data-filter="active">Active</button>
        <button type="button" class="filter-button" data-filter="completed">Completed</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
